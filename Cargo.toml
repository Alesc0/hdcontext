[package]
name = "hdcontext"
version = "0.1.0"
edition = "2024"
description = "Find, preview, and export gaming highlights using video and audio"
license = "MIT"
default-run = "hdcontext"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
walkdir = "2"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
directories = "6"
keyring = { version = "3.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
